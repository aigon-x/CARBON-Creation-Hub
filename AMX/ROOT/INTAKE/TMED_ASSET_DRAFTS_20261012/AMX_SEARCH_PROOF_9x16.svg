<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><title>Search proof vertical draft</title><rect width="1080" height="1920" fill="#0A0D12"/><rect width="1080" height="12" fill="#00C4FF"/><text x="64" y="110" font-family="Arial" font-size="24" font-weight="700" fill="#00C4FF">PROOF OF EXECUTION</text><text x="64" y="220" font-family="Arial" font-size="58" font-weight="700" fill="#F7F8FA">What 36/36</text><text x="64" y="292" font-family="Arial" font-size="58" font-weight="700" fill="#F7F8FA">actually means.</text><text x="64" y="380" font-family="Arial" font-size="25" fill="#A7B0BC">Two separate test scopes. One clear boundary.</text><rect x="64" y="500" width="952" height="170" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="570" font-family="Arial" font-size="48" font-weight="700" fill="#00C4FF">36/36</text><text x="100" y="620" font-family="Arial" font-size="24" fill="#F7F8FA">Search-specific executable tests</text><rect x="64" y="700" width="952" height="170" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="770" font-family="Arial" font-size="48" font-weight="700" fill="#00C4FF">81/81</text><text x="100" y="820" font-family="Arial" font-size="24" fill="#F7F8FA">Full-repository CI for first-cycle build</text><rect x="64" y="900" width="952" height="220" rx="16" fill="#152431" stroke="#00C4FF" stroke-width="2"/><text x="100" y="965" font-family="Arial" font-size="22" font-weight="700" fill="#00C4FF">EVIDENCE BOUNDARY</text><text x="100" y="1015" font-family="Arial" font-size="22" fill="#F7F8FA">Tests do not prove buyer acceptance.</text><text x="100" y="1055" font-family="Arial" font-size="22" fill="#F7F8FA">Later convergence remains a separate gate.</text><text x="64" y="1840" font-family="Arial" font-size="20" fill="#A7B0BC">AMilliMATRiX | DRAFT - OWNER INSPECTION ONLY</text></svg>