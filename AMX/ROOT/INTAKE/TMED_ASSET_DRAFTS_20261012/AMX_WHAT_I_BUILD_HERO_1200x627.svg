<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627"><title>What I build draft</title><rect width="1200" height="627" fill="#0A0D12"/><rect width="1200" height="10" fill="#00C4FF"/><text x="56" y="66" font-family="Arial" font-size="18" font-weight="700" fill="#00C4FF">WHAT I BUILD</text><text x="56" y="145" font-family="Arial" font-size="42" font-weight="700" fill="#F7F8FA">From request to verified handoff.</text><g font-family="Arial" fill="#F7F8FA"><rect x="56" y="220" width="210" height="110" rx="12" fill="#111923" stroke="#263444"/><text x="78" y="260" font-size="24" font-weight="700" fill="#00C4FF">01</text><text x="78" y="296" font-size="18">Request</text><rect x="286" y="220" width="210" height="110" rx="12" fill="#111923" stroke="#263444"/><text x="308" y="260" font-size="24" font-weight="700" fill="#00C4FF">02</text><text x="308" y="296" font-size="18">Route</text><rect x="516" y="220" width="210" height="110" rx="12" fill="#111923" stroke="#263444"/><text x="538" y="260" font-size="24" font-weight="700" fill="#00C4FF">03</text><text x="538" y="296" font-size="18">Build</text><rect x="746" y="220" width="210" height="110" rx="12" fill="#111923" stroke="#263444"/><text x="768" y="260" font-size="24" font-weight="700" fill="#00C4FF">04</text><text x="768" y="296" font-size="18">Verify</text><rect x="976" y="220" width="168" height="110" rx="12" fill="#111923" stroke="#263444"/><text x="998" y="260" font-size="24" font-weight="700" fill="#00C4FF">05</text><text x="998" y="296" font-size="18">Handoff</text></g><rect x="56" y="370" width="1088" height="112" rx="12" fill="#152431" stroke="#00C4FF" stroke-width="2"/><text x="88" y="414" font-family="Arial" font-size="21" font-weight="700" fill="#F7F8FA">Illustrative workflow, not a live dashboard.</text><text x="88" y="452" font-family="Arial" font-size="19" fill="#F7F8FA">Tested is not deployed. Deployed is not accepted. Accepted is not paid.</text><text x="610" y="522" font-family="Arial" font-size="13" fill="#A7B0BC">Bounded evidence: Search, Marketplace, D01 and D02</text><line x1="48" y1="575" x2="1152" y2="575" stroke="#263444" stroke-width="2"/><text x="48" y="601" font-family="Arial" font-size="16" fill="#A7B0BC">AMilliMATRiX | DRAFT - OWNER INSPECTION ONLY</text></svg>