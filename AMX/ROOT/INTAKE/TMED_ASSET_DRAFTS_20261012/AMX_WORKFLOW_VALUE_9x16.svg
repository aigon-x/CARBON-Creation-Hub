<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><title>Workflow value vertical draft</title><rect width="1080" height="1920" fill="#0A0D12"/><rect width="1080" height="12" fill="#00C4FF"/><text x="64" y="110" font-family="Arial" font-size="24" font-weight="700" fill="#00C4FF">BUSINESS VALUE</text><text x="64" y="220" font-family="Arial" font-size="58" font-weight="700" fill="#F7F8FA">The output is</text><text x="64" y="292" font-family="Arial" font-size="58" font-weight="700" fill="#F7F8FA">only one step.</text><text x="64" y="380" font-family="Arial" font-size="25" fill="#A7B0BC">A useful handoff preserves the whole chain.</text><g font-family="Arial"><rect x="64" y="500" width="952" height="140" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="555" font-size="34" font-weight="700" fill="#00C4FF">REQUEST</text><text x="100" y="600" font-size="23" fill="#F7F8FA">Define the real problem and success condition</text><rect x="64" y="665" width="952" height="140" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="720" font-size="34" font-weight="700" fill="#00C4FF">ROUTE</text><text x="100" y="765" font-size="23" fill="#F7F8FA">Use the correct capability and preserve access</text><rect x="64" y="830" width="952" height="140" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="885" font-size="34" font-weight="700" fill="#00C4FF">VERIFY</text><text x="100" y="930" font-size="23" fill="#F7F8FA">Test behavior and read back the actual result</text><rect x="64" y="995" width="952" height="140" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="1050" font-size="34" font-weight="700" fill="#00C4FF">HANDOFF</text><text x="100" y="1095" font-size="23" fill="#F7F8FA">Name the next action and remaining gap</text></g><rect x="64" y="1170" width="952" height="200" rx="16" fill="#152431" stroke="#00C4FF" stroke-width="2"/><text x="100" y="1230" font-family="Arial" font-size="22" font-weight="700" fill="#00C4FF">BOUNDARY</text><text x="100" y="1280" font-family="Arial" font-size="22" fill="#F7F8FA">Illustrative workflow, not a live dashboard.</text><text x="100" y="1320" font-family="Arial" font-size="22" fill="#F7F8FA">No buyer outcome is implied.</text><text x="64" y="1840" font-family="Arial" font-size="20" fill="#A7B0BC">AMilliMATRiX | DRAFT - OWNER INSPECTION ONLY</text></svg>