<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><title>Proof of work vertical draft</title><rect width="1080" height="1920" fill="#0A0D12"/><rect width="1080" height="12" fill="#00C4FF"/><text x="64" y="110" font-family="Arial" font-size="24" font-weight="700" fill="#00C4FF">BOUNDED PROOF OF WORK</text><text x="64" y="220" font-family="Arial" font-size="58" font-weight="700" fill="#F7F8FA">Bring one</text><text x="64" y="292" font-family="Arial" font-size="58" font-weight="700" fill="#F7F8FA">bounded problem.</text><text x="64" y="380" font-family="Arial" font-size="25" fill="#A7B0BC">Start with the acceptance condition.</text><g font-family="Arial"><rect x="64" y="500" width="952" height="140" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="555" font-size="34" font-weight="700" fill="#00C4FF">INPUT</text><text x="100" y="600" font-size="23" fill="#F7F8FA">What goes in?</text><rect x="64" y="665" width="952" height="140" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="720" font-size="34" font-weight="700" fill="#00C4FF">OUTPUT</text><text x="100" y="765" font-size="23" fill="#F7F8FA">What must be delivered?</text><rect x="64" y="830" width="952" height="140" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="885" font-size="34" font-weight="700" fill="#00C4FF">CONSTRAINTS</text><text x="100" y="930" font-size="23" fill="#F7F8FA">What must not be exposed?</text><rect x="64" y="995" width="952" height="140" rx="16" fill="#111923" stroke="#263444" stroke-width="2"/><text x="100" y="1050" font-size="34" font-weight="700" fill="#00C4FF">ACCEPTANCE</text><text x="100" y="1095" font-size="23" fill="#F7F8FA">How will success be judged?</text></g><rect x="64" y="1170" width="952" height="200" rx="16" fill="#152431" stroke="#00C4FF" stroke-width="2"/><text x="100" y="1230" font-family="Arial" font-size="22" font-weight="700" fill="#00C4FF">BOUNDARY</text><text x="100" y="1280" font-family="Arial" font-size="22" fill="#F7F8FA">No result is promised before testing.</text><text x="100" y="1320" font-family="Arial" font-size="22" fill="#F7F8FA">Use an approved commercial route only.</text><text x="64" y="1840" font-family="Arial" font-size="20" fill="#A7B0BC">AMilliMATRiX | DRAFT - OWNER INSPECTION ONLY</text></svg>